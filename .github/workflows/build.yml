
name: Build Ryven Tweaker V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Ryven Tweaker V2
        shell: pwsh
        run: |
          dotnet publish "RyvenTweakerV2-source/RyvenTweakerV2/RyvenTweaker.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload V2 EXE
        uses: actions/upload-artifact@v4
        with:
          name: RyvenTweaker-V2-Windows-x64
          path: publish/
          if-no-files-found: error
