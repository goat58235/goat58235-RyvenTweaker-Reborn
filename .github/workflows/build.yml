
name: Build Ryven Tweaker V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V2 dependencies
        run: dotnet restore "./RyvenTweakerV2/RyvenTweaker.csproj" -r win-x64

      - name: Build V2
        run: dotnet build "./RyvenTweakerV2/RyvenTweaker.csproj" --configuration Release --no-restore

      - name: Publish V2 Windows EXE
        run: dotnet publish "./RyvenTweakerV2/RyvenTweaker.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output "./publish"

      - name: Upload V2 EXE
        uses: actions/upload-artifact@v4
        with:
          name: RyvenTweaker-V2-Windows-x64
          path: ./publish/
          if-no-files-found: error
          retention-days: 30
